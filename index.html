<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HawkBet – South Lakes Pick'em</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#home">
    <img class="logo-img" src="logo.svg" width="40" height="40" alt="">
    <span class="wordmark">Hawk<b>Bet</b></span>
  </a>
  <nav class="tabs" id="nav">
    <a href="#home" data-v="home">🏠 Home</a>
    <a href="#arcade" data-v="arcade">🎰 Arcade</a>
    <a href="#bank" data-v="bank">🏦 Bank</a>
    <a href="#leaders" data-v="leaders">🏆 Leaderboard</a>
    <a href="#luck" data-v="luck">🍀 Luck Lab</a>
    <a href="#board" data-v="board">Picks</a>
    <a href="#lineups" data-v="lineups">My Lineups</a>
    <a href="#admin" data-v="admin" id="adminLink" class="hidden">Admin</a>
  </nav>
  <div class="bal" id="balbox" title="Fake credits only"><span class="coin">🪙</span><b id="bal">0</b><small>Hawk Bucks</small></div>
  <button class="pill sndbtn" id="sound" aria-pressed="true" aria-label="Sound on" title="Sound on/off">🔊</button>
  <button class="pill hidden" id="logout"></button>
</header>

<div class="banner">Fake credits only · no real money · not affiliated with South Lakes HS or FCPS · lines are demo data</div>

<main id="app"></main>

<div id="slipbar" class="slipbar hidden"><button id="slipbtn"></button></div>
<aside id="slip" class="slip hidden"></aside>
<div id="toast" class="toast"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="bgfx" aria-hidden="true"><i></i><i></i><i></i></div>

<script src="app.js"></script>
</body>
</html>
